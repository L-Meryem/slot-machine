<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Your description goes here">
	<meta name="keywords" content="one, two, three">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Slot Machine</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<main>
		<h1>💰<span id="balance">1000</span><span id="win"></span></h1>

		<div class="spinner">
			<div class="reel"><span>🦄</span></div>
			<div class="reel"><span>🦄</span></div>
			<div class="reel"><span>🦄</span></div>
		</div>

		<div class="buttons">

			<h1 id="min_bet">$5</h1>
			<h1 id="max_bet">$50</h1>
		</div>
		<div class="info">

			<div class="stats">
				<small>Total Wins : <span id="lastWin"></span></small>
				<small>Total Losses : <span id="loss"></span></small>
			</div>
			<ul class="legend">
				<li>🧞‍♀️ ➝ 20x bet</li>
				<li>🦄 ➝ 10x bet</li>
				<li>🦧 ➝ 5x bet</li>
				<li>🐸 ➝ 3x bet</li>
				<li>🗿 ➝ 2x bet</li>
			</ul>
		</div>


	</main>

	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
